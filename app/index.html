<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient agent</title>
<script>try { const t = localStorage.getItem('stage-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root {
  --bg: #0a0a0b; --surface: #111113; --surface-2: #18181b; --line: #232327; --line-strong: #36363d;
  --fg: #ededef; --muted: #8f8f98; --primary: #7c6cff; --success: #3ddc97; --warning: #f5a524; --danger: #ff6b6b;
  --sans: Inter, "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #fafafa; --surface: #fff; --surface-2: #f4f4f5; --line: #e6e6e9; --line-strong: #d0d0d6; --fg: #111113; --muted: #62626b; --primary: #5b4cf0; --success: #0c8f62; --warning: #a86400; --danger: #d42f2f; color-scheme: light; }
}
:root[data-theme="light"] { --bg: #fafafa; --surface: #fff; --surface-2: #f4f4f5; --line: #e6e6e9; --line-strong: #d0d0d6; --fg: #111113; --muted: #62626b; --primary: #5b4cf0; --success: #0c8f62; --warning: #a86400; --danger: #d42f2f; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; max-width: 1320px; margin: 0 auto; padding: 16px; column-gap: 18px; row-gap: 12px; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 20px; letter-spacing: -.02em; margin: 0; }
.embed header { display: none; }
.tag { font: 13px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 10px; }
.tag.step { color: var(--primary); border-color: var(--primary); }
select, button, textarea, input { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; }
button { padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
#log { grid-column: 1; grid-row: 2; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.error { align-self: flex-start; color: var(--danger); border: 1px solid var(--danger); background: transparent; }
.msg code { font: 14px var(--mono); background: var(--surface-2); border-radius: 5px; padding: 0 4px; }
/* What the agent did on its own: a report in the thread, not a reply. */
.report { align-self: flex-start; max-width: 88%; border: 1px solid var(--line-strong); border-left: 3px solid var(--primary); border-radius: 10px; padding: 8px 12px; background: var(--surface); font-size: 15px; }
.report.ask { border-left-color: var(--warning); }
.report.digest { border-left-color: var(--muted); white-space: pre-wrap; }
.report .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 12.5px var(--mono); color: var(--muted); margin-bottom: 2px; }
.report .meta .watch { color: var(--primary); }
.report .history { list-style: none; margin: 0 0 4px; padding: 0; font-size: 13px; color: var(--muted); }
.report .history li::before { content: '· '; }
.report .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.report .row button { font-size: 13px; padding: 3px 12px; }
.report .row button.yes { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
.report .row small { color: var(--muted); font-size: 13px; }
details.tool { align-self: flex-start; max-width: 88%; font: 13.5px var(--mono); color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 6px 10px; }
details.tool summary { cursor: pointer; }
details.tool summary b { color: var(--primary); font-weight: 600; }
details.tool pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 54ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.chips button { font-size: 14px; border-radius: 999px; }
form { grid-column: 1; grid-row: 3; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
textarea { resize: none; padding: 10px 12px; min-height: 48px; max-height: 160px; }
aside { grid-column: 2; grid-row: 2 / span 2; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 18px; border-left: 1px solid var(--line); padding-left: 16px; }
aside h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
aside h2 small { text-transform: none; letter-spacing: 0; font: 12px var(--mono); }
aside ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.watch-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 10px; background: var(--surface); }
.watch-item button { border: 0; background: transparent; color: var(--muted); padding: 0 8px; }
.ev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 13.5px; }
.ev span:first-child { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }
.ev em { display: block; font-style: normal; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.st-filtered, .st-ignored, .st-merged { color: var(--muted) !important; }
.st-working { color: var(--warning) !important; }
.st-done { color: var(--success) !important; }
.sim { display: flex; flex-wrap: wrap; gap: 6px; }
.sim button { font-size: 13px; padding: 4px 10px; }
#memory-section { display: none; }
.has-memory #memory-section { display: block; }
button.file { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; padding: 3px 6px; border-radius: 6px; font: 13px var(--mono); }
button.file:hover, button.file[aria-expanded="true"] { background: var(--surface-2); }
button.file.fresh { color: var(--primary); }
button.file small { color: var(--muted); }
aside pre { margin: 4px 0 8px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font: 12px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(360px, 1fr) auto auto; height: auto; min-height: 100%; }
  #log { grid-row: auto; }
  form { grid-row: auto; }
  aside { grid-column: 1; grid-row: auto; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 14px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1 id="title">Ambient agent</h1>
    <span class="tag step" id="ref">…</span>
    <span class="tag" id="mode"></span>
    <span class="tag" id="counts"></span>
  </header>

  <main id="log" aria-live="polite" aria-label="The main thread">
    <div class="empty" id="empty">
      <p>The main thread. Talk to the agent here; from step 3 on, it also reports here on its own when something you asked it to watch happens.</p>
      <div class="chips" id="chips"></div>
    </div>
  </main>

  <form id="form">
    <label for="input" hidden>Message</label>
    <textarea id="input" rows="1" placeholder="Talk to the agent… (Enter to send)"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>

  <aside aria-label="What the agent is set up to do">
    <section>
      <h2>Watches <small>say “watch for …”</small></h2>
      <ul id="watches"><li class="muted">None.</li></ul>
    </section>
    <section id="memory-section">
      <h2>Memory <small id="memory-where"></small></h2>
      <ul id="memory-files"></ul>
    </section>
    <section>
      <h2>Events <small id="event-counts"></small></h2>
      <ul id="events"><li class="muted">No events yet.</li></ul>
    </section>
    <section>
      <h2>Simulate</h2>
      <div class="sim">
        <button type="button" data-trigger="cat-pr">Cat PR</button>
        <button type="button" data-trigger="pr-opened">Other PR</button>
        <button type="button" data-trigger="new-issue">New issue</button>
        <button type="button" data-trigger="ci-failed">CI fails</button>
        <button type="button" data-storm>Storm (60 events)</button>
        <button type="button" data-reset>Reset</button>
      </div>
    </section>
  </aside>
</div>
<script>
// The agent's own app, served by the agent on its port: every API call is same-origin.
const params = new URLSearchParams(location.search);
if (params.has('embed')) document.body.classList.add('embed');
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const format = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const time = (ms) => new Date(ms).toTimeString().slice(0, 5);
const api = (path, body) => fetch(`/api/${path}`, body === undefined ? undefined : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
const SUGGESTIONS = [
  'Watch for PRs about cats.',
  'What do you watch for?',
  'What happened while I was away?',
  'What open issues and PRs do we have?',
  'Ping me at most twice a day.',
];
let busy = false;
let openAsks = new Set();

$('chips').replaceChildren(...SUGGESTIONS.map((s) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = s; b.onclick = () => send(s);
  return b;
}));

function scrollDown() { $('log').scrollTop = $('log').scrollHeight; }

function add(kind, html = '') {
  $('empty')?.remove();
  const div = document.createElement('div');
  div.className = `msg ${kind}`;
  div.innerHTML = html;
  $('log').append(div);
  scrollDown();
  return div;
}

function addTool(name, input) {
  $('empty')?.remove();
  const d = document.createElement('details');
  d.className = 'tool';
  const args = input && Object.keys(input).length ? JSON.stringify(input) : '';
  d.innerHTML = `<summary>→ <b>${esc(name)}</b> ${esc(args)}</summary><pre>running…</pre>`;
  $('log').append(d);
  scrollDown();
  return d;
}

// ---------- you and the agent ----------
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  add('you', esc(text));
  busy = true; $('send').disabled = true; $('input').value = '';
  let bubble = null, raw = '';
  const pending = [];
  try {
    const r = await api('chat', { message: text });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error ?? r.statusText);
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines.filter(Boolean)) {
        const p = JSON.parse(line);
        if (p.t === 'text') {
          if (!bubble) { bubble = add('agent'); raw = ''; }
          raw += p.text; bubble.innerHTML = format(raw);
        } else if (p.t === 'tool') {
          bubble = null; pending.push(addTool(p.name, p.input));
        } else if (p.t === 'tool-result') {
          const d = pending.shift();
          if (d) d.querySelector('pre').textContent = p.output;
        } else if (p.t === 'error') {
          add('error', esc(p.error));
        }
        scrollDown();
      }
    }
  } catch (e) {
    add('error', esc(e.message ?? e));
  } finally {
    busy = false; $('send').disabled = false; $('input').focus();
    refresh();
  }
}

$('form').onsubmit = (e) => { e.preventDefault(); send($('input').value); };
$('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send($('input').value); } };
// The presenter view can type into the chat on the slide.
new BroadcastChannel('workshop-chat').onmessage = ({ data }) => { if (data?.type === 'ask' && typeof data.text === 'string') send(data.text); };

// ---------- reports: what the agent says on its own ----------
const cards = new Map();   // thread entry id → { el, sig }
let firstLoad = true;

function reportHtml(e) {
  const ask = e.askId !== undefined;
  const history = (e.updates ?? []).map((u) => `<li>${time(u.at)} ${esc(u.text)}</li>`).join('');
  const buttons = ask ? (openAsks.has(e.askId)
    ? `<div class="row"><button type="button" class="yes" data-ask="${e.askId}" data-yes="1">Yes</button><button type="button" data-ask="${e.askId}" data-yes="0">No</button></div>`
    : '<div class="row"><small>answered</small></div>') : '';
  return `<div class="meta"><span>${time(e.at)}</span>${e.subject ? `<span>${esc(e.subject)}</span>` : ''}${e.watch ? `<span class="watch">watch: ${esc(e.watch)}</span>` : ''}</div>${history ? `<ul class="history">${history}</ul>` : ''}<div>${format(e.text)}</div>${buttons}`;
}

function renderEntry(e) {
  if (e.kind === 'you' || e.kind === 'agent') {
    // Your messages and its answers are drawn while you chat; from the server only on first load.
    if (firstLoad) add(e.kind, e.kind === 'agent' ? format(e.text) : esc(e.text));
    return;
  }
  const sig = JSON.stringify([e.text, e.updates?.length ?? 0, e.askId !== undefined && openAsks.has(e.askId)]);
  const known = cards.get(e.id);
  if (known && known.sig === sig) return;
  const el = known?.el ?? document.createElement('div');
  el.className = `report${e.kind === 'digest' ? ' digest' : ''}${e.askId !== undefined ? ' ask' : ''}`;
  el.innerHTML = reportHtml(e);
  el.querySelectorAll('[data-ask]').forEach((b) => {
    b.onclick = () => {
      el.querySelectorAll('button').forEach((x) => (x.disabled = true));
      api('answer', { id: Number(b.dataset.ask), yes: b.dataset.yes === '1' }).then(refresh);
    };
  });
  // A grouped report that changed moves to the bottom, like a thread bumping.
  const updates = e.updates?.length ?? 0;
  if (!known || known.updates !== updates) { $('empty')?.remove(); $('log').append(el); scrollDown(); }
  cards.set(e.id, { el, sig, updates });
}

async function refreshThread() {
  const { entries } = await (await api('thread')).json();
  const ids = new Set(entries.map((e) => e.id));
  for (const [id, { el }] of cards) if (!ids.has(id)) { el.remove(); cards.delete(id); }
  entries.forEach(renderEntry);
  firstLoad = false;
}

// ---------- the side panel ----------
function renderState(s) {
  document.title = `${s.instance} · ${s.ref}`;
  $('title').textContent = s.instance;
  $('ref').textContent = s.ref;
  $('mode').textContent = `worker ${s.workerMode} · gate ${s.gateMode}`;
  const st = s.stats ?? {};
  $('counts').textContent = `${st.received ?? 0} events · ${st.workerRuns ?? 0} runs · ${st.pingsSent ?? 0} reports${st.pingsHeld ? ` · ${st.pingsHeld} for the digest` : ''}${s.budget ? ` · max ${s.budget}/day` : ''}`;
  openAsks = new Set((s.asks ?? []).map((a) => a.id));
  const events = s.events ?? [];
  $('event-counts').textContent = `${st.filtered ?? 0} dropped · ${st.ignored ?? 0} ignored`;
  $('events').innerHTML = events.length
    ? events.slice(-12).reverse().map((e) => `<li class="ev"><span class="st-${esc(e.stage)}">${esc(e.stage)}</span><span>${esc(e.title)}<em>${esc(e.actor)} · ${esc(e.subject)}${e.reason ? ` · ${esc(e.reason)}` : ''}</em></span></li>`).join('')
    : '<li class="muted">No events yet. Use Simulate below, or wait for GitHub.</li>';
}

async function renderWatches() {
  const { watches } = await (await api('watches')).json();
  $('watches').replaceChildren(...(watches.length ? watches : [null]).map((w) => {
    const li = document.createElement('li');
    if (w === null) { li.className = 'muted'; li.textContent = 'None.'; return li; }
    li.className = 'watch-item';
    li.innerHTML = `<span>${esc(w)}</span><button type="button" aria-label="Stop watching ${esc(w)}">×</button>`;
    li.querySelector('button').onclick = () => api('watches', { remove: w }).then(renderWatches);
    return li;
  }));
}

// Step 7 on: memory files.
const lineCounts = new Map();
const fileText = new Map();
let openFile = null;
async function renderMemory() {
  let memory = null;
  try { const r = await api('memory'); if (r.ok) memory = await r.json(); } catch {}
  $('app').classList.toggle('has-memory', Boolean(memory));
  if (!memory) return;
  $('memory-where').textContent = memory.where.startsWith('daytona:') ? 'Daytona sandbox' : 'memory/';
  $('memory-files').replaceChildren(...memory.files.map((f) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    const grew = lineCounts.has(f.path) && lineCounts.get(f.path) !== f.lines;
    lineCounts.set(f.path, f.lines);
    b.type = 'button'; b.className = `file${grew ? ' fresh' : ''}`;
    b.setAttribute('aria-expanded', String(openFile === f.path));
    b.innerHTML = `<span>${esc(f.path)}</span><small>${f.lines}</small>`;
    b.onclick = () => { openFile = openFile === f.path ? null : f.path; renderMemory(); };
    li.append(b);
    if (openFile === f.path) {
      const pre = document.createElement('pre');
      pre.textContent = fileText.get(f.path) ?? '…';
      api(`memory/file?path=${encodeURIComponent(f.path)}`).then((r) => r.json()).then((d) => { fileText.set(f.path, d.text ?? d.error); pre.textContent = fileText.get(f.path); });
      li.append(pre);
    }
    return li;
  }));
}

async function refresh() {
  try { renderState(await (await api('state')).json()); } catch {}
  try { await refreshThread(); } catch {}
  renderWatches().catch(() => {});
  renderMemory();
}

document.querySelectorAll('[data-trigger]').forEach((b) => { b.onclick = () => api('trigger', { scenario: b.dataset.trigger }).then(refresh); });
document.querySelector('[data-storm]').onclick = () => api('reset', {}).then(() => api('storm', {})).then(() => { $('log').replaceChildren(); cards.clear(); refresh(); });
document.querySelector('[data-reset]').onclick = () => api('reset', {}).then(() => { $('log').replaceChildren(); cards.clear(); refresh(); });
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
