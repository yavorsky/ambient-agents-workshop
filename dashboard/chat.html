<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent chat</title>
<script>try { const t = localStorage.getItem('stage-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root {
  --bg: #0a0a0b; --surface: #111113; --surface-2: #18181b; --line: #232327; --line-strong: #36363d;
  --fg: #ededef; --muted: #8f8f98; --primary: #7c6cff; --success: #3ddc97; --danger: #ff6b6b;
  --sans: Inter, "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #fafafa; --surface: #fff; --surface-2: #f4f4f5; --line: #e6e6e9; --line-strong: #d0d0d6; --fg: #111113; --muted: #62626b; --primary: #5b4cf0; --success: #0c8f62; --danger: #d42f2f; color-scheme: light; }
}
:root[data-theme="light"] { --bg: #fafafa; --surface: #fff; --surface-2: #f4f4f5; --line: #e6e6e9; --line-strong: #d0d0d6; --fg: #111113; --muted: #62626b; --primary: #5b4cf0; --success: #0c8f62; --danger: #d42f2f; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100%; max-width: 920px; margin: 0 auto; padding: 16px; gap: 12px; }
.app.has-memory { max-width: 1240px; grid-template-columns: minmax(0, 1fr) 320px; }
.app.has-memory header, .app.has-memory form { grid-column: 1; }
#memory { display: none; grid-column: 2; grid-row: 1 / span 3; border-left: 1px solid var(--line); padding-left: 14px; overflow-y: auto; }
.app.has-memory #memory { display: block; }
#memory h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 0 2px; }
#memory .where { font: 12px var(--mono); color: var(--muted); margin: 0 0 10px; overflow-wrap: anywhere; }
#memory ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#memory button.file { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; font: 13px var(--mono); }
#memory button.file:hover, #memory button.file[aria-expanded="true"] { background: var(--surface-2); }
#memory button.file.fresh { color: var(--primary); }
#memory button.file small { color: var(--muted); }
#memory pre { margin: 4px 0 8px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font: 12px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; }
@media (max-width: 860px) { .app.has-memory { grid-template-columns: minmax(0, 1fr); } #memory { display: none !important; } }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 20px; letter-spacing: -.02em; margin: 0 auto 0 0; }
.embed header h1 { display: none; }
select, button, textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; }
select, button { padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.status { font: 13px var(--mono); color: var(--muted); }
.status.on::before { content: '● '; color: var(--success); }
.status.off::before { content: '● '; color: var(--danger); }
#log { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.agent:empty::after { content: '…'; color: var(--muted); }
.msg.error { align-self: flex-start; color: var(--danger); border: 1px solid var(--danger); background: transparent; }
.msg code { font: 14px var(--mono); background: var(--surface-2); border-radius: 5px; padding: 0 4px; }
details.tool { align-self: flex-start; max-width: 88%; font: 13.5px var(--mono); color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 6px 10px; }
details.tool summary { cursor: pointer; }
details.tool summary b { color: var(--primary); font-weight: 600; }
details.tool pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 52ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.chips button { font-size: 14px; border-radius: 999px; }
form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
textarea { resize: none; padding: 10px 12px; min-height: 48px; max-height: 160px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Talk to the agent</h1>
    <label class="status" id="status" aria-live="polite">…</label>
    <select id="instance" aria-label="Agent instance"></select>
    <button id="new" type="button">New conversation</button>
  </header>
  <main id="log" aria-live="polite" aria-label="Conversation">
    <div class="empty" id="empty">
      <p>A model, a few read-only tools (the repo, GitHub, its skills, what it has seen lately) and a loop. You ask, it looks things up, it answers.</p>
      <div class="chips" id="chips"></div>
    </div>
  </main>
  <aside id="memory" aria-label="Memory files">
    <h2>Memory</h2>
    <p class="where" id="memory-where"></p>
    <ul id="memory-files"></ul>
  </aside>
  <form id="form">
    <label for="input" hidden>Message</label>
    <textarea id="input" rows="1" placeholder="Ask the agent… (Enter to send)"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</div>
<script>
const params = new URLSearchParams(location.search);
if (params.has('embed')) document.body.classList.add('embed');
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const format = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const SUGGESTIONS = [
  'What is this repo, in two lines?',
  'What open issues and PRs do we have?',
  'Did CI pass lately?',
  'Load the fix-ci skill: what would you do when CI breaks?',
  'What happened while I was away?',
];
let instances = [];
let target = params.get('instance') ?? 'stage';
let session = crypto.randomUUID();
let busy = false;

$('chips').replaceChildren(...SUGGESTIONS.map((s) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = s; b.onclick = () => send(s);
  return b;
}));

async function poll() {
  try { instances = await (await fetch('/api/instances')).json(); } catch { instances = []; }
  const names = [...new Set([target, ...instances.map((i) => i.name)])];
  const sel = $('instance');
  if ([...sel.options].map((o) => o.value).join() !== names.join()) sel.replaceChildren(...names.map((n) => new Option(n, n)));
  sel.value = target;
  const entry = instances.find((i) => i.name === target);
  $('status').className = `status ${entry ? 'on' : 'off'}`;
  $('status').textContent = entry ? `${entry.ref} · :${entry.port}` : 'not running';
  pollMemory(entry);
}

// Step 7 on: the agent has memory files and one conversation. Show the files as they appear.
const lineCounts = new Map();
const fileText = new Map();
let openFile = null;
async function pollMemory(entry) {
  let memory = null;
  if (entry) try {
    const r = await fetch(`http://localhost:${entry.port}/api/memory`);
    if (r.ok) memory = await r.json();
  } catch {}
  $('app').classList.toggle('has-memory', Boolean(memory));
  $('new').hidden = Boolean(memory);
  $('input').placeholder = memory ? 'Ask the agent… one conversation, it reads its memory when it needs to' : 'Ask the agent… (Enter to send)';
  if (!memory) return;
  $('memory-where').textContent = memory.where.replace(/^.*\/(?=[^/]+\/memory$)/, '…/');
  $('memory-files').replaceChildren(...memory.files.map((f) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    const grew = lineCounts.has(f.path) && lineCounts.get(f.path) !== f.lines;
    lineCounts.set(f.path, f.lines);
    b.type = 'button'; b.className = `file${grew ? ' fresh' : ''}`;
    b.setAttribute('aria-expanded', String(openFile === f.path));
    b.innerHTML = `<span>${esc(f.path)}</span><small>${f.lines}</small>`;
    b.onclick = () => { openFile = openFile === f.path ? null : f.path; pollMemory(entry); };
    li.append(b);
    if (openFile === f.path) {
      const pre = document.createElement('pre');
      pre.textContent = fileText.get(f.path) ?? '…';
      fetch(`http://localhost:${entry.port}/api/memory/file?path=${encodeURIComponent(f.path)}`).then((r) => r.json()).then((d) => { fileText.set(f.path, d.text ?? d.error); pre.textContent = fileText.get(f.path); });
      li.append(pre);
    }
    return li;
  }));
}
$('instance').onchange = (e) => { target = e.target.value; newConversation(); poll(); };

function add(kind, html = '') {
  $('empty')?.remove();
  const div = document.createElement('div');
  div.className = `msg ${kind}`;
  div.innerHTML = html;
  $('log').append(div);
  $('log').scrollTop = $('log').scrollHeight;
  return div;
}

function addTool(name, input) {
  $('empty')?.remove();
  const d = document.createElement('details');
  d.className = 'tool';
  const args = input && Object.keys(input).length ? JSON.stringify(input) : '';
  d.innerHTML = `<summary>→ <b>${esc(name)}</b> ${esc(args)}</summary><pre>running…</pre>`;
  $('log').append(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

async function send(text) {
  text = text.trim();
  const entry = instances.find((i) => i.name === target);
  if (!text || busy) return;
  add('you', esc(text));
  if (!entry) return add('error', esc(`The ${target} agent is not running.`));
  busy = true; $('send').disabled = true; $('input').value = '';
  let bubble = null, raw = '';
  const pending = [];
  try {
    const r = await fetch(`http://localhost:${entry.port}/api/chat`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session, message: text }) });
    if (r.status === 404) throw new Error(`${entry.ref} has no chat yet: it arrives at step-1.`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error ?? r.statusText);
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines.filter(Boolean)) {
        const p = JSON.parse(line);
        if (p.t === 'text') {
          if (!bubble) { bubble = add('agent'); raw = ''; }
          raw += p.text; bubble.innerHTML = format(raw);
        } else if (p.t === 'tool') {
          bubble = null; pending.push(addTool(p.name, p.input));
        } else if (p.t === 'tool-result') {
          const d = pending.shift();
          if (d) d.querySelector('pre').textContent = p.output;
        } else if (p.t === 'error') {
          add('error', esc(p.error));
        }
        $('log').scrollTop = $('log').scrollHeight;
      }
    }
  } catch (e) {
    add('error', esc(e.message ?? e));
  } finally {
    busy = false; $('send').disabled = false; $('input').focus();
  }
}

function newConversation() {
  session = crypto.randomUUID();
  $('log').replaceChildren();
  add('agent', 'New conversation.').classList.add('status');
}
$('new').onclick = newConversation;
$('form').onsubmit = (e) => { e.preventDefault(); send($('input').value); };
$('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send($('input').value); } };
// The presenter view can type into the slide's chat.
new BroadcastChannel('workshop-chat').onmessage = ({ data }) => { if (data?.type === 'ask' && typeof data.text === 'string') send(data.text); };
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
